services:
  - type: web
    name: paranaque-web-system
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && CI=false npm run build && cd backend && npm install && echo "✅ Build complete with build folder at $(pwd)/../build"
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: BACKEND_URL
        value: https://paranaque-web-system.onrender.com
      - key: FRONTEND_URL
        value: https://paranaque-web-system.onrender.com
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: EMAIL_FROM
        value: Paranaledge Library <noreply@paranaledge.online>
      - key: AI_PROVIDER
        value: openai
